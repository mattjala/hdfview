# JUnit Platform configuration for the HDFView UI (SWTBot) test suite.
#
# The default timeout is the second line of defence against a wedged test run. SWTBot tests
# drive a live SWT event loop, and a dialog that never appears - or an event loop that stops
# pumping - can block a test method indefinitely. Without a timeout here, that blocks the fork,
# which blocks the Maven build, which burns the whole CI job budget and produces no surefire
# XML at all.
#
# Applies to @Test, @BeforeEach/@AfterEach and @BeforeAll/@AfterAll alike. Individual tests that
# legitimately need longer can override with an explicit @Timeout.
#
# Note this cannot break a thread out of a *native* call - SWT/GTK blocking inside
# gdk_threads_enter() is RUNNABLE, not interruptible, and JUnit can only report the timeout
# once the call returns. The surefire forkedProcessTimeoutInSeconds in hdfview/pom.xml is the
# backstop for that case.
junit.jupiter.execution.timeout.default = 2 m

# Keep UI tests strictly sequential: they share one application window and one SWT display.
junit.jupiter.execution.parallel.enabled = false
